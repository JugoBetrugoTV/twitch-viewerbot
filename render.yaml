# Render.com Blueprint. In Render: New + → "Blueprint" → point at this repo.
# Render reads this file, builds the Docker image and deploys the site.
# Set BNET_CLIENT_ID / BNET_CLIENT_SECRET in the dashboard (they are marked
# sync:false so they are NOT stored in the repo).
services:
  - type: web
    name: azeroth-armory
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BNET_CLIENT_ID
        sync: false
      - key: BNET_CLIENT_SECRET
        sync: false
      - key: DEFAULT_REGION
        value: eu
      - key: LOCALE
        value: en_US
